include_pos: true
include_dep: true
no_entity_ratio: 0.25


#generate:
kshot_size: 3
input_file_type: list 
min_samples_per_cluster: 10
weighted_threshold: 1.5
max_iterations: 5
overlap_threshold: 1.5
NCBI_train:  ~/syn-bioner/data/ncbi/trf/ncbi_ner_train.json
NCBI_kshot:  ~/syn-bioner/data/ncbi/trf/ncbi_ner_train_10pct.json
Generated_train:  ~/syn-bioner/data/NCBI-Disease/synthetic_10_trial/generated_10_3000.json
output_directory:  ~/syn-bioner/data/generation_pipeline/
spacy_model: en_core_web_trf

#general:
random_seed: 42
test: true
verbose: true

#pipeline:
min_samples_per_cluster: 10 # Minimum number of synthetic samples required per cluster to consider it covered.
weighted_threshold: 0.75 # Weighted coverage threshold to stop iterations (global overlap).
max_iterations: 5 
overlap_threshold: 0.75 # Wanted cluster overlap treshold per cluster.

#bioNER
ner_model_eval: true
ncbi_dev_set:  ~/syn-bioner/data/ncbi/devel.json
num_train_iter: 20






