wl_iterations: 1
dimensions: 32
workers: 24
learning_rate: 0.05
min_count: 2
epochs: 20

#  kmeans:
k: 5
cluster_dir:  ~/syn-bioner/data/generation_pipeline/kmeans_clusters
k_min: 5
k_max: 15

#server:
server_url: http://0.0.0.0:8484
temperature: 0
