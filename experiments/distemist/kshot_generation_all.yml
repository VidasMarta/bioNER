disease_file: data/KB/SNOMEDCT/concepts_disease_filtered_sp.csv
obo_file_path: false
output_directory: data/synthetic/distemist/${K_SHOT}shot_syn_generation_100pct_0shot_${KSHOT_CHECK}shot_check_${SIZE}
server_url: http://0.0.0.0:${PORT}
pairs_file_path: ''

spacy_model: es_dep_news_trf

generate_k: 25000 #800000
random_seed: 42
batch: ${BATCH}

system_template: role_sent_type_prompt
user_template: genre_syn_generation_new

kshot_size: ${K_SHOT}

system_template_check: 'annotation'
user_template_check: disease_annotation_reduced
kshot_check: ${KSHOT_CHECK}

avoid_words: paciente, individuo o sujeto
language: spanish

kshot_pool: data/processed/${CORPUS}/trf/${CORPUS}_ner_train.json
no_entity_ratio: 0.7

temperature: 0
max_tokens: ${MAX_TOKENS}

include_pos: false #true
include_dep: false #true

verbose: true #false
test: ${TEST}

