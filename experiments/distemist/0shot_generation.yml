disease_file: data/KB/SNOMEDCT/concepts_disease_filtered_sp.csv
obo_file_path: false
output_directory: ${OUTPUT_DIR_SCRATCH}
server_url: http://0.0.0.0:${PORT}
pairs_file_path: ''

spacy_model: es_dep_news_trf

generate_k: 25000
random_seed: 42
batch: ${BATCH}

system_template: role_sent_type_prompt
user_template: genre_syn_generation_new
kshot_size: 0

system_template_check: 'annotation'
user_template_check: disease_annotation_reduced
kshot_check: ${KSHOT_CHECK}

avoid_words: paciente, individuo o sujeto
language: spanish
no_entity_ratio: 0.7

kshot_pool: ''
temperature: 0
max_tokens: ${MAX_TOKENS}

include_pos: true
include_dep: true

verbose: true #false
test: ${TEST}

