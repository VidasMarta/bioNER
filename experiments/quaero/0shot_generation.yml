disease_file: data/KB/ICD10FR/concepts_filtered_fr.csv
obo_file_path: false
output_directory: data/synthetic/${CORPUS}/0shot_syn_generation_${KSHOT_CHECK}shot_check_${SIZE}
server_url: http://0.0.0.0:${PORT}
pairs_file_path: ''

spacy_model: fr_dep_news_trf

generate_k: 25000
random_seed: 42
batch: ${BATCH}

system_template: role_sent_type_prompt
user_template: genre_syn_generation_new
kshot_size: 0

system_template_check: 'annotation'
user_template_check: disease_annotation_reduced
kshot_check: ${KSHOT_CHECK}
no_entity_ratio: 0.52 

avoid_words: Patient, patiente, individu ou sujet
genre_group: "titles and leflets"
language: french
kshot_pool: ''
temperature: 0
max_tokens: ${MAX_TOKENS}


include_pos: true
include_dep: true

verbose: true #false
test: ${TEST}

