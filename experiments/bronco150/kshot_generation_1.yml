disease_file: data/KB/ICD10_GE_CH/concepts_filtered_ge.csv
obo_file_path: false
output_directory: data/synthetic/${CORPUS}/0shot_syn_generation_${KSHOT_CHECK}shot_check_${SIZE}
server_url: http://0.0.0.0:${PORT}
pairs_file_path: ''

spacy_model: de_dep_news_trf

generate_k: 25000
random_seed: 42
batch: ${BATCH}

system_template: role_sent_type_prompt
user_template: genre_syn_generation_new
kshot_size: ${K_SHOT}

system_template_check: 'annotation'
user_template_check: disease_annotation_reduced
kshot_check: ${KSHOT_CHECK}

avoid_words: Patient, Patientin, Individuum oder Subjekt
language: german
genre_group: clinical
kshot_pool: data/processed/${CORPUS}/trf/${CORPUS}_ner_train_${PCT}pct.json
no_entity_ratio: 0.52 #calculated on whole NCBI train

temperature: 0
max_tokens: ${MAX_TOKENS}

include_pos: false #true
include_dep: false #true

verbose: true #false
test: ${TEST}